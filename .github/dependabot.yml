version: 2
updates:
  # NuGet dependencies — all .csproj files across src/, samples/, test/.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "nuget"
    ignore:
      # FluentAssertions v7 moved to a commercial license (Xceed). v6.12.x is the last
      # Apache-2.0 release. Stay on 6.12.* until the licensing situation changes or we
      # migrate to a different assertion library.
      - dependency-name: "FluentAssertions"
        versions: [">=7.0.0"]
      # Microsoft.Extensions.* majors track the .NET major (11.x means net11.0). We target
      # net10.0; take the next major together with a deliberate target-framework change.
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      # ABP is the package's floor, not just a dependency: raising $(AbpVersion) in
      # Directory.Build.props raises the minimum ABP every consumer must run, so it is bumped
      # by hand, deliberately. Patch releases already float through the 10.1.* range.
      - dependency-name: "Volo.Abp.*"
    groups:
      # Roll Microsoft minor/patch bumps into one PR so the queue stays clean.
      microsoft:
        patterns:
          - "Microsoft.*"
          - "System.*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions versions — keep our pinned uses: refs current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      # Group all Actions bumps together so we get one rebase-friendly PR instead of
      # three that all touch the same workflow files (which is what we got for our
      # first batch — checkout / setup-dotnet / upload-artifact each as separate PRs).
      actions:
        patterns:
          - "*"

  # The bridge (bridge/, the abp-mcp npm package). Its runtime dependency is the MCP TypeScript SDK; dev tooling is grouped.
  - package-ecosystem: "npm"
    directory: "/bridge"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    ignore:
      # typescript-eslint supports TypeScript below 6.1. TypeScript 7 is the native (Go) compiler, without the
      # JavaScript API typescript-eslint is built on. Lift this once typescript-eslint supports newer versions.
      - dependency-name: "typescript"
        versions: [">=6.1.0"]
      # The bridge supports Node 22 and later, so its Node types stay on 22: newer ones would let code use
      # APIs that Node 22 does not have.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      bridge-dev-tooling:
        dependency-type: "development"
