name: Release

# Triggered when a tag of the form v* is pushed (e.g. v0.2.0-alpha, v1.2.3).
# Builds, tests, packs, (optionally) signs, then publishes to nuget.org via Trusted Publishing
# (OIDC — no API-key secret) and creates a GitHub Release with the .nupkg attached.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Manual version to publish (e.g. 0.2.0-alpha). Used only when running by hand.'
        required: true
        type: string

permissions:
  contents: write   # for `gh release create`
  id-token: write   # for NuGet Trusted Publishing (OIDC token exchange)

jobs:
  publish:
    name: Build, Pack, Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # required so `gh release create --generate-notes` can diff history

      - name: Setup .NET (9 + 10)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
            TAG="v${VERSION}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=$TAG version=$VERSION"

      - name: Restore
        run: dotnet restore

      - name: Build (Release, with overridden version)
        run: |
          dotnet build \
            --no-restore \
            --configuration Release \
            -p:Version=${{ steps.ver.outputs.version }} \
            -p:ContinuousIntegrationBuild=true

      - name: Test (must pass before publishing)
        run: |
          dotnet test \
            --no-build \
            --configuration Release \
            --logger "console;verbosity=normal"

      - name: Pack
        run: |
          dotnet pack src/AbpMcp/AbpMcp.csproj \
            --no-build \
            --configuration Release \
            -p:Version=${{ steps.ver.outputs.version }} \
            -o artifacts

      # Signing is OPTIONAL and self-healing: it runs only when NUGET_SIGNING_CERTIFICATE_B64 is
      # present AND decodes to a non-empty file. An unset, empty, or malformed secret publishes
      # UNSIGNED rather than failing the release (nuget.org accepts unsigned packages).
      - name: Check signing availability
        id: signcheck
        env:
          NUGET_SIGNING_CERTIFICATE_B64: ${{ secrets.NUGET_SIGNING_CERTIFICATE_B64 }}
        run: |
          if [[ -z "${NUGET_SIGNING_CERTIFICATE_B64}" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No signing certificate configured — publishing UNSIGNED."
            exit 0
          fi
          # Decode here so a malformed secret disables signing instead of failing a later step.
          umask 077
          if echo "${NUGET_SIGNING_CERTIFICATE_B64}" | base64 -d > "$RUNNER_TEMP/codesign.pfx" 2>/dev/null && [[ -s "$RUNNER_TEMP/codesign.pfx" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Signing certificate decoded — the package will be signed."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            rm -f "$RUNNER_TEMP/codesign.pfx"
            echo "::warning::NUGET_SIGNING_CERTIFICATE_B64 is set but is not valid base64 — publishing UNSIGNED. Delete or fix that secret to enable signing."
          fi

      - name: Sign package
        if: steps.signcheck.outputs.enabled == 'true'
        env:
          NUGET_SIGNING_PASSWORD: ${{ secrets.NUGET_SIGNING_PASSWORD }}
        run: |
          if [[ -z "${NUGET_SIGNING_PASSWORD}" ]]; then
            echo "::error::A signing certificate is set but NUGET_SIGNING_PASSWORD is missing."
            exit 1
          fi
          dotnet nuget sign artifacts/*.nupkg \
            --certificate-path "$RUNNER_TEMP/codesign.pfx" \
            --certificate-password "$NUGET_SIGNING_PASSWORD" \
            --timestamper http://timestamp.digicert.com \
            --timestamp-hash-algorithm SHA256

      # Informational only. A self-signed author cert won't chain to a public root, so
      # `verify --all`'s trust check fails even though the signature is valid and nuget.org
      # (which checks the registered certificate fingerprint, not public trust) accepts it.
      - name: Verify signature
        if: steps.signcheck.outputs.enabled == 'true'
        continue-on-error: true
        run: dotnet nuget verify artifacts/*.nupkg --all

      - name: Wipe signing key from runner
        if: always() && steps.signcheck.outputs.enabled == 'true'
        run: |
          shred -u "$RUNNER_TEMP/codesign.pfx" 2>/dev/null || rm -f "$RUNNER_TEMP/codesign.pfx"

      # Trusted Publishing: exchange the GitHub OIDC token for a short-lived nuget.org key.
      # No NUGET_API_KEY secret — authorization comes from the Trusted Publisher policy on
      # nuget.org. `user` must be the username of the policy CREATOR (ak-itani), not the
      # package-owner org (Tekthar) — nuget.org looks the policy up under the creator account.
      - name: NuGet login (Trusted Publishing)
        id: nugetlogin
        uses: NuGet/login@v1
        with:
          user: ak-itani

      - name: Push to nuget.org
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "${{ steps.nugetlogin.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pre-releases are anything containing a hyphen (e.g. 0.2.0-alpha).
          PRERELEASE_FLAG=""
          if [[ "${{ steps.ver.outputs.version }}" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "${{ steps.ver.outputs.tag }}" \
            --title "${{ steps.ver.outputs.tag }}" \
            --generate-notes \
            $PRERELEASE_FLAG \
            artifacts/*.nupkg
