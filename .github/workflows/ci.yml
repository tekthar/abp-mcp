name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Cancel in-progress runs for the same branch in PRs to save Actions minutes;
# always finish runs against `main` so badges reflect the actual commit state.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    name: Build & Test (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore (cached)
        run: dotnet restore

      - name: Build (Release, warnings-as-errors)
        run: dotnet build --no-restore --configuration Release

      - name: Test (with TRX results)
        run: |
          dotnet test \
            --no-build \
            --configuration Release \
            --logger "trx;LogFileName=test-results.trx" \
            --logger "console;verbosity=normal" \
            --results-directory "${GITHUB_WORKSPACE}/test-results"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/**/*.trx
          if-no-files-found: warn

  # abp-mcp is compiled against its ABP floor (AbpVersion) but hosts run newer ABPs. ABP 10.4 renamed
  # IApiDescriptionModelProvider.CreateApiModel to CreateApiModelAsync, and every host on 10.4+ failed
  # at boot with MissingMethodException while the job above stayed green. This job builds abp-mcp the
  # same way and runs the sample and the integration tests on the newest ABP 10.x.
  host-on-newest-abp:
    name: Test with the host on the newest ABP 10.x
    runs-on: ubuntu-latest
    env:
      ABP_HOST_VERSION: "10.*"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore -p:AbpHostVersion="${ABP_HOST_VERSION}"

      - name: Build (Release, warnings-as-errors)
        run: dotnet build --no-restore --configuration Release -p:AbpHostVersion="${ABP_HOST_VERSION}"

      - name: Test
        run: |
          dotnet test \
            --no-build \
            --configuration Release \
            -p:AbpHostVersion="${ABP_HOST_VERSION}" \
            --logger "console;verbosity=normal"

  pack-smoke:
    name: Pack smoke (NuGet)
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Pack (dry run, ensures the package is producible from main)
        run: |
          dotnet pack src/AbpMcp/AbpMcp.csproj \
            --configuration Release \
            -o artifacts

      - name: Upload nupkg artifact
        uses: actions/upload-artifact@v7
        with:
          name: AbpMcp-nupkg-preview
          path: artifacts/*.nupkg
          if-no-files-found: error
